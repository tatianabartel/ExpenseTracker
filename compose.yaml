services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: expensetracker:dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://expense:expense@db:5432/expense
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
