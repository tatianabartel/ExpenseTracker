name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://expense:expense@localhost:5432/expense
      TEST_DATABASE_URL: postgresql+psycopg://expense:expense@localhost:5432/expense

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check migrations are reversible
        run: alembic downgrade base && alembic upgrade head

      - name: Run tests
        run: pytest -v
